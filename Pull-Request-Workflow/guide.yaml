## 3. Gate 2: PR Creation

### 3.1 PR Title Format

Use conventional commits format:

```
type(scope): description

Examples:
feat(auth): add OAuth2 support
fix(api): handle null response
docs(readme): update installation guide
refactor(utils): simplify helper functions
test(api): add integration tests
```

### 3.2 PR Description Template

```markdown
## Description
Brief description of changes.

## Related Issue
Fixes #123

## Changes
- Change 1
- Change 2

## Testing
- [ ] Unit tests added
- [ ] Integration tests added
- [ ] Manual testing completed

## Checklist
- [ ] Code reviewed
- [ ] Tests pass
- [ ] Documentation updated
```

### 3.3 Labels and Milestones

| Label | Purpose |
|-------|---------|
| bug | Bug fix PR |
| feature | New feature PR |
| docs | Documentation PR |
| draft | WIP, not ready for review |
| ready | Ready for review |

---

## 4. Gate 3: PR Review

### 4.1 Review Process

```
1. Initial Review
   ├─ Check PR description
   ├─ Verify tests exist
   └─ Check code quality

2. Detailed Review
   ├─ Review each file
   ├─ Check patterns
   └─ Verify correctness

3. Feedback
   ├─ Request changes
   ├─ Suggest improvements
   └─ Approve or reject
```

### 4.2 Review Checklist

Reviewer checklist:

- [ ] PR description is clear
- [ ] Changes are minimal
- [ ] Tests are adequate
- [ ] Code follows patterns
- [ ] No security issues
- [ ] Documentation updated
- [ ] No breaking changes

### 4.3 Review Integration

Connects to:
- **Code-Quality**: Security and testing checks
- **Core-Development-Roles**: Review communication
- **Issue-Management**: Issue reference verification

---

## 5. Gate 4: PR Merge

### 5.1 Merge Criteria

A PR can be merged when:

- [ ] All reviews approved
- [ ] All CI checks pass
- [ ] No unresolved conversations
- [ ] PR description complete
- [ ] Issue linked (if applicable)

### 5.2 Merge Strategies

| Strategy | Use Case |
|----------|----------|
| **Squash** | Combine commits for clean history |
| **Rebase** | Maintain linear history |
| **Merge commit** | Preserve exact commit history |

### 5.3 Post-Merge Actions

After merging:

1. Delete feature branch
2. Monitor CI/CD for issues
3. Update project board
4. Close related issues
5. Notify team

