## Quick Start

```bash
# Create PR branch
git checkout -b feature/my-feature
git push -u origin feature/my-feature

# Create PR
gh pr create --title "feat: description" --body "details"

# Review PR
gh pr view 123 --web

# Merge PR
gh pr merge 123 --squash --auto
```

