## 7. Best Practices

### 7.1 Reviewer Best Practices

- Review within 24-48 hours
- Be constructive and respectful
- Focus on code, not people
- Ask clarifying questions
- Approve when ready

### 7.2 Author Best Practices

- Keep PRs small
- Write clear descriptions
- Respond to feedback quickly
- Make requested changes
- Thank reviewers

### 7.3 Team Best Practices

- Set review expectations
- Use PR templates
- Automate checks
- Track review times
- Celebrate merges

---

## 8. Troubleshooting

### 8.1 Common PR Issues

| Problem | Solution |
|---------|----------|
| Stale PR | Ping reviewer, add "ready" label |
| CI failure | Fix issues, check logs |
| Merge conflict | Rebase on main, resolve conflicts |
| Unclear feedback | Ask for clarification |

### 8.2 Communication Templates

```markdown
# Requesting Review
@username could you please review this PR?

# Addressing Feedback
I've addressed your comments. Thanks for the suggestions!

# Bumping for Review
This PR is ready for review. It fixes #[issue-number].
```

