## 8. Troubleshooting

### 8.1 Common Test Issues

| Problem | Solution |
|---------|----------|
| Test timeout | Increase timeout, check async code |
| Flaky test | Use unique test IDs, avoid shared state |
| Coverage gap | Add tests for missing branches |
| Mock issues | Reset mocks between tests |

### 8.2 Security Troubleshooting

| Issue | Resolution |
|-------|------------|
| Vulnerability found | Update dependency, apply patch |
| False positive | Configure tool, suppress with reason |
| Secret leak | Rotate key, use env variables |
| Dependency conflict | Pin versions, use lockfile |

### 8.3 CI/CD Troubleshooting

| Error | Fix |
|-------|-----|
| Build fails | Check logs, fix configuration |
| Test timeout | Increase resources, optimize tests |
| Cache miss | Fix cache key, restore cache |
| Deployment error | Check permissions, review config |

