## 3. Gate 2: Testing Strategy

### 3.1 Testing Pyramid

```
        ┌─────────────────────┐
        │   E2E Tests (5%)    │  End-to-end user flows
        └─────────────────────┘
        ┌─────────────────────┐
       │ Integration Tests   │  Component interactions
       │      (15%)          │
       └─────────────────────┘
┌───────────────────────────────┐
│        Unit Tests             │  Individual functions/modules
│           (80%)               │
└───────────────────────────────┘
```

### 3.2 Test Types and Frameworks

| Test Type | Purpose | Tools |
|-----------|---------|-------|
| Unit | Test individual functions | pytest, Jest, Vitest |
| Integration | Test component interactions | Supertest, React Testing Library |
| E2E | Test complete user flows | Cypress, Playwright |
| Property-based | Test with generated inputs | Hypothesis, fast-check |
| Mutation | Test test quality | Stryker, Cosmic-Ray |

### 3.3 Testing Patterns

#### Python Testing Pattern

```python
import pytest
from mymodule import process_data

def test_process_data_success():
    """Test successful data processing."""
    result = process_data({"key": "value"})
    assert result["status"] == "success"

def test_process_data_empty():
    """Test handling of empty input."""
    result = process_data({})
    assert result["status"] == "empty"

@pytest.mark.parametrize("input,expected", [
    ({"valid": True}, "success"),
    ({}, "empty"),
])
def test_parametrized(input, expected):
    assert process_data(input)["status"] == expected
```

#### JavaScript Testing Pattern

```javascript
import { process_data } from './process_data';

describe('process_data', () => {
  test('handles valid input', () => {
    const result = process_data({ key: 'value' });
    expect(result.status).toBe('success');
  });

  test('handles empty input', () => {
    const result = process_data({});
    expect(result.status).toBe('empty');
  });
});
```

### 3.4 Test Execution Strategy

```yaml
# CI Pipeline Example
test:
  stage: test
  script:
    - pytest tests/ --cov=src --cov-report=xml
    - npm run test:unit
    - npm run test:integration
  coverage: '/TOTAL.*\s+(\d+%)$/'
  after_script:
    - bash <(curl -s https://codecov.io/bash)
```

