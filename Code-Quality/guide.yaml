## 1. Code Quality Overview

Code quality is the foundation of maintainable, reliable, and secure open source software. This folder provides expert guidance for testing, security auditing, CI/CD, and dependency management.

### The Four Dimensions of Code Quality

| Dimension | Description | Tools |
|-----------|-------------|-------|
| **Testing** | Ensuring correctness through automated tests | pytest, Jest, Vitest, etc. |
| **Security** | Identifying and mitigating vulnerabilities | Snyk, npm audit, safety |
| **CI/CD** | Automating quality checks in pipelines | GitHub Actions, GitLab CI |
| **Dependencies** | Managing third-party packages safely | Dependabot, Poetry, npm |

### When to Use Each Quality File

- **Testing-Pro.md**: When implementing or improving test coverage
- **Security-Audit-Pro.md**: When conducting security reviews or vulnerability assessments
- **CI-CD-Pro.md**: When setting up or improving CI/CD pipelines
- **Dependency-Pro.md**: When managing dependencies or auditing supply chain

