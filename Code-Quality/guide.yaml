## 5. Gate 4: CI/CD Integration

### 5.1 CI/CD Quality Pipeline

```yaml
name: Quality Checks
on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: flake8 src/
      
      - name: Run tests
        run: pytest --cov=src/
      
      - name: Run security scan
        run: bandit -r src/
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
```

### 5.2 Quality Reporting

Generate quality reports:

| Report | Tool | Output |
|--------|------|--------|
| Coverage | pytest-cov | HTML/XML report |
| Security | bandit/snyk | JSON/HTML report |
| Linting | flake8/eslint | Checkstyle XML |
| Duplication | jscpd | JSON report |

### 5.3 Quality Gates in CI

Fail builds on quality issues:

```yaml
- name: Enforce coverage minimum
  run: |
    coverage=$(pytest --cov=src/ --cov-report=term | grep TOTAL | awk '{print $4}' | tr -d '%')
    if [ "$coverage" -lt 80 ]; then
      echo "Coverage $coverage% below minimum 80%"
      exit 1
    fi
```

