## 4. Gate 3: Security Auditing

### 4.1 Security Audit Checklist

| Category | Items to Check |
|----------|---------------|
| **Dependencies** | Outdated packages, known vulnerabilities |
| **Code** | Injection vulnerabilities, auth issues |
| **Configuration** | Exposed secrets, insecure defaults |
| **Infrastructure** | Permissions, network exposure |

### 4.2 Security Tools by Language

#### Python Security Tools

```bash
# Check for known vulnerabilities
pip install safety
safety check

# Check for insecure code patterns
pip install bandit
bandit -r src/

# Check for outdated dependencies
pip list --outdated
```

#### JavaScript Security Tools

```bash
# Audit dependencies
npm audit
npm audit fix

# Check for vulnerabilities
npx audit-ci --high

# SAST scanning
npx eslint-plugin-security
```

### 4.3 Security Patterns

| Vulnerability | Detection | Prevention |
|---------------|-----------|------------|
| SQL Injection | Input validation | Parameterized queries |
| XSS | Output encoding | Sanitize user input |
| Command Injection | Input validation | Avoid shell execution |
| Path Traversal | Path validation | Use safe path methods |

