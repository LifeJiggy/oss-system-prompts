## 7. Versioning Patterns

### 7.1 Version File Patterns

#### Python (pyproject.toml)

```toml
[tool.poetry]
version = "1.2.0"
```

#### JavaScript (package.json)

```json
{
  "version": "1.2.0"
}
```

#### Shell (version.txt)

```
1.2.0
```

### 7.2 Release Branch Patterns

| Pattern | Use Case |
|---------|----------|
| `main` | Production releases |
| `dev` | Development branch |
| `release/vX.Y.Z` | Release preparation |
| `feature/name` | New features |
| `hotfix/name` | Emergency fixes |

### 7.3 Changelog Patterns

```markdown
# Changelog

## [1.2.0] - 2024-01-15

### Added
- New feature X
- New feature Y

### Changed
- Improved performance

### Fixed
- Bug in module Z
```

