## 8. Troubleshooting

### 8.1 Common Release Issues

| Problem | Solution |
|---------|----------|
| Package not published | Check permissions, npm login |
| Version already exists | Bump version, use patch |
| Tests failing on main | Rebase, fix conflicts |
| Tag already exists | Delete tag, recreate |

### 8.2 Rollback Procedures

```bash
# Unpublish npm package (72h window)
npm unpublish package-name

# Delete PyPI version
# Contact PyPI support

# Delete GitHub release
gh release delete v1.2.0
```

---

## Quick Start

```bash
# Version bump (minor)
npm version minor
# or
poetry version minor

# Build and publish
npm run build
npm publish

# Create release
gh release create v1.2.0 --generate-notes
```

