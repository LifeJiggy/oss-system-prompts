## 7. Template Patterns

### 7.1 Markdown Template Pattern

```markdown
## Pull Request: [Title]

### Overview
Brief description of the change.

### Changes
- File 1: Description
- File 2: Description

### Testing
- [ ] Unit tests
- [ ] Integration tests
- [ ] Manual testing

### Checklist
- [ ] Code reviewed
- [ ] Tests pass
- [ ] Documentation updated
```

### 7.2 Script Template Pattern

```python
def create_pr_template():
    return f"""
## Pull Request: {title}

### Overview
{description}

### Changes
{changes}

### Testing
{testing}

### Checklist
{checklist}
"""

def validate_changes(files):
    # Validation logic
    return True
```

