## 1. PR Templates Overview

PR templates provide structured, consistent descriptions for pull requests, improving communication and review efficiency.

### The Three Template Types

| Type | Format | Use Case |
|------|--------|----------|
| **Python Scripts** | `.py` | Generate, validate programmatically |
| **JavaScript Scripts** | `.js` | Node.js automation |
| **Markdown** | `.md` | Direct copy-paste use |

### Template Categories

| Category | Count | Purpose |
|----------|-------|---------|
| Python Scripts | 7 | Run to generate/validate |
| JavaScript Scripts | 7 | Node.js integration |
| Markdown Templates | 29 | Direct PR descriptions |

