## 3. Gate 2: Template Usage

### 3.1 Markdown Template Usage

```bash
# View available templates
ls Templates/

# Copy template
cat Templates/Contributor-Pro.md

# Use in PR description
# Paste content into GitHub PR description
```

### 3.2 Python Script Usage

```bash
# Generate template
python PY/features-file.py

# Run validation
python -c "from PY.features_file import validate_file_changes"

# Save to file
python PY/features-bugfix.py > bug-fix-pr.md
```

### 3.3 JavaScript Script Usage

```bash
# Generate template
node JS/features-file.js

# Run validation
node -e "require('./JS/features-file').validateFileChanges(['file.js'])"
```

