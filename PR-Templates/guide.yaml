## 2. Gate 1: Template Selection

### 2.1 Template Selection Matrix

| Change Type | Recommended Template |
|-------------|---------------------|
| Bug fix | `Issue-fixer-Pro.md`, `features-bugfix.py` |
| New feature | `High-frequence-features-Pro.md`, `features-integration.py` |
| Code review | `Reveiwer-Pro.md`, `features-review.py` |
| Documentation | `Documentation-Pro.md`, `features-docs.py` |
| Tests | `Testing-Pro.md`, `features-tests.py` |
| Refactoring | `Low-frequence-features-Pro.md`, `features-refactor.py` |

### 2.2 Selection Criteria

1. **Match the change type** - Bug fix, feature, docs, etc.
2. **Consider audience** - Reviewers, maintainers, users
3. **Check complexity** - Simple change vs complex feature
4. **Review requirements** - What needs to be communicated

