## 4. Gate 3: Customization

### 4.1 Customization Checklist

- [ ] Update PR title to match changes
- [ ] Fill in all relevant sections
- [ ] Replace placeholders with actual values
- [ ] Add specific details for reviewers
- [ ] Link to related issues
- [ ] Update checklists appropriately

### 4.2 Placeholder Examples

| Placeholder | Replacement |
|-------------|-------------|
| `<!-- Brief description -->` | "Fix null pointer in user service" |
| `{ISSUE_NUMBER}` | "123" |
| `{AUTHOR_NAME}` | "Jane Doe" |
| `{TEST_COVERAGE}` | "85%" |

### 4.3 Customization Patterns

```markdown
## Changes Details
- File: src/user/service.ts
- Change: Added null check for getUser()
- Impact: Prevents crash when user not found

## Testing
- Unit tests: Added 3 new test cases
- Integration tests: Pass
- Manual testing: Verified fix works
```

---

## 5. Gate 4: Validation

### 5.1 Pre-Submission Validation

- [ ] Template properly filled out
- [ ] No placeholder text remaining
- [ ] All required sections completed
- [ ] Links work correctly
- [ ] Code blocks are valid
- [ ] Checkboxes are accurate

### 5.2 Automated Validation

```bash
# Python validation
python -c "
from PY.features_file import validate_file_changes
result = validate_file_changes(['src/file.ts'])
print(f'Valid: {result}')
"

# JavaScript validation
node -e "
const { validateFileChanges } = require('./JS/features-file');
const result = validateFileChanges(['file.js']);
console.log('Valid:', result);
"
```

### 5.3 Review Readiness

Before submitting:

- [ ] PR title follows conventions
- [ ] Description is clear and complete
- [ ] All checkboxes accurate
- [ ] No sensitive information included
- [ ] Reviewer(s) identified

