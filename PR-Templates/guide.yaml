## 8. Troubleshooting

### 8.1 Common Template Issues

| Problem | Solution |
|---------|----------|
| Missing sections | Use full template |
| Placeholder not replaced | Search and replace |
| Invalid code blocks | Fix syntax highlighting |
| Broken links | Update URLs |

### 8.2 Script Execution Issues

| Error | Solution |
|-------|----------|
| Module not found | Install dependencies |
| Permission denied | Check file permissions |
| Syntax error | Check Python/Node version |

