## 5. Gate 4: Role Execution

### 5.1 Architect Execution Flow

1. **Problem Analysis**
   - Understand requirements and constraints
   - Identify stakeholders and their needs
   - Research existing solutions and alternatives

2. **Design Phase**
   - Create architecture diagrams
   - Define components and interfaces
   - Document trade-offs and decisions

3. **Validation**
   - Review with team and stakeholders
   - Iterate on feedback
   - Finalize documentation

### 5.2 Contributor Execution Flow

1. **Task Preparation**
   - Read the issue or requirements
   - Discuss approach if needed
   - Understand existing patterns

2. **Implementation**
   - Write code following project conventions
   - Add appropriate tests
   - Update documentation

3. **Self-Review**
   - Run all checks (lint, test, typecheck)
   - Review your own diff
   - Ensure no regressions

### 5.3 Reviewer Execution Flow

1. **Pre-Review Checklist**
   - Verify PR follows project conventions
   - Check for obvious issues (typos, formatting)
   - Ensure PR description is complete

2. **Code Review**
   - Review logic correctness
   - Check for security issues
   - Verify test coverage

3. **Feedback**
   - Provide clear, actionable feedback
   - Be respectful and constructive
   - Approve when ready

### 5.4 Maintainer Execution Flow

1. **Release Planning**
   - Review roadmap and priorities
   - Coordinate with contributors
   - Plan release timeline

2. **Release Execution**
   - Manage merge process
   - Create release tags
   - Publish packages

3. **Community Management**
   - Respond to issues and PRs
   - Mentor new contributors
   - Update governance documents

