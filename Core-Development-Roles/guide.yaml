## 2. Gate 1: Role Selection

### 2.1 Decision Matrix

Use this matrix to select the appropriate role for your task:

| Task Type | Primary Role | Secondary Roles |
|-----------|--------------|-----------------|
| New feature design | Architect | Contributor, Reviewer |
| Code implementation | Contributor | Reviewer |
| Bug fix | Contributor | Reviewer |
| Code review | Reviewer | Maintainer |
| Release planning | Maintainer | Architect |
| Community management | Maintainer | Contributor |
| Technical documentation | Contributor | Architect |

### 2.2 Role Prerequisites

Before using any role prompt, ensure you understand:

1. **Project context**: Read the main README and CONTRIBUTING files
2. **Existing patterns**: Study similar code in the repository
3. **Tooling setup**: Ensure required tools are installed and configured
4. **Branch strategy**: Understand the project's branching model

### 2.3 Cross-Role Collaboration

Roles often work together in a cycle:

```
┌─────────────┐    ┌──────────────┐    ┌─────────────┐
│  Architect  │───▶│ Contributor  │───▶│   Reviewer  │
└─────────────┘    └──────────────┘    └─────────────┘
       ▲                                    │
       │                                    ▼
       │                              ┌─────────────┐
       └──────────────────────────────│ Maintainer  │
                                      └─────────────┘
```

