## 7. Integration Patterns

### 7.1 Role-to-Core Integration

Each role should integrate with the core knowledge base:

```yaml
# Example integration pattern
role: Contributor
core_files:
  - ../core/guide.md          # Step-by-step workflow
  - ../core/patterns.md       # Code patterns
  - ../core/checklist.md      # Pre-submission check
  - ../core/review-response.md # Communication guide
```

### 7.2 Multi-Role Collaboration

For complex tasks requiring multiple roles:

1. **Architecture Review**: Architect + Maintainer + Contributor
2. **Large Feature**: Architect → Contributor → Reviewer → Maintainer
3. **Bug Fix**: Contributor → Reviewer (Maintainer if security-related)

