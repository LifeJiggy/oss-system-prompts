## 8. Success Metrics

### 8.1 Role-Specific KPIs

| Role | Metric | Target |
|------|--------|--------|
| Architect | Design reviews passed | 100% |
| Contributor | PRs merged | 80% first attempt |
| Reviewer | Review time | < 24 hours |
| Maintainer | Release cadence | Predictable schedule |

### 8.2 Quality Gates

Before completing tasks in each role:

- [ ] All checks pass (CI, lint, typecheck)
- [ ] Documentation updated
- [ ] Tests included (if applicable)
- [ ] Reviewed by appropriate role
- [ ] Follows project conventions

### 8.3 Continuous Improvement

Regularly review and improve:

1. **Process**: Are workflows efficient?
2. **Documentation**: Is guidance clear and accurate?
3. **Tools**: Are the right tools being used?
4. **Outcomes**: Are goals being met?

