## 3. Gate 2: Environment Preparation

### 3.1 Required Tools by Role

**All Roles:**
- Git (latest version)
- Text editor or IDE
- Terminal/command line

**Contributor & Reviewer:**
- Language-specific tools (Python, Node.js, etc.)
- Testing framework
- Linter/formatter

**Architect & Maintainer:**
- Diagramming tools (for architecture documentation)
- Project management tools
- Release tooling

### 3.2 Repository Setup

```bash
# Fork and clone
git clone https://github.com/YOUR_USERNAME/project-name.git
cd project-name

# Add upstream remote
git remote add upstream https://github.com/ORIGINAL_OWNER/project-name.git

# Install dependencies
npm install  # or pip install -r requirements.txt

# Create feature branch
git checkout -b feature/your-feature-name
```

### 3.3 Reference Documentation

Before proceeding, read these essential files:

1. **Main README**: [../../README.md](../../README.md)
2. **Contributing Guide**: [../../Contributing.md](../../Contributing.md)
3. **Core Knowledge Base**: [../core/README.md](../core/README.md)
4. **Project-specific docs**: Check for GOVERNANCE.md, CODE_OF_CONDUCT.md, etc.

