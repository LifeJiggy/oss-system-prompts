## 1. Role Overview

The Core Development Roles folder contains system prompts for fundamental OSS development activities. Each prompt transforms your AI assistant into a specialized expert with deep domain knowledge.

### The Four Pillars of Core Development

| Role | Purpose | Key Responsibilities |
|------|---------|---------------------|
| **Architect** | System design expert | Architecture decisions, technical planning, design patterns |
| **Contributor** | Code contribution specialist | Implementation, testing, documentation, issue resolution |
| **Reviewer** | Quality assurance expert | Code review, feedback, style enforcement, quality gates |
| **Maintainer** | Project leadership expert | Release management, governance, community, roadmap |

### When to Use Each Role

- **Architect-Pro.md**: Before major feature development, system redesign, or technical decision-making
- **Contributor-Pro.md**: When implementing features, fixing bugs, or adding new functionality
- **Reveiwer-Pro.md**: During code review processes, quality checks, or pre-merge validation
- **Maintainer-Pro.md**: For release coordination, governance decisions, or community management

