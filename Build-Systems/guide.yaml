## 3. Gate 2: Environment Setup

### 3.1 Python Build Environment

```bash
# Install Poetry
curl -sSL https://install.python-poetry.org | python3 -

# Install dependencies
poetry install

# Activate virtual environment
poetry shell

# Run build
poetry build
```

### 3.2 JavaScript Build Environment

```bash
# Install Node.js dependencies
npm install

# Development build
npm run dev

# Production build
npm run build

# Run tests
npm test
```

### 3.3 Shell Build Environment

```bash
# Install dependencies (if any)
make install

# Run build
make build

# Run tests
make test

# Clean build artifacts
make clean
```

### 3.4 Common Setup Files

| File | Purpose |
|------|---------|
| package.json | JavaScript project configuration |
| pyproject.toml | Python project configuration |
| Makefile | Shell build automation |
| .gitignore | Version control exclusions |

