## 1. Build System Overview

Build systems are critical infrastructure that transform source code into deployable artifacts. This folder provides expert guidance for Python, JavaScript, and Shell build engineering.

### The Three Pillars of Build Engineering

| Pillar | Description | Tools Covered |
|--------|-------------|---------------|
| **Packaging** | Creating distributable artifacts | setuptools, Poetry, pyinstaller, Webpack, Vite, esbuild, Rollup, Make, CMake |
| **Compilation** | Transforming and optimizing code | TypeScript, ES modules, C/C++ compilation |
| **Automation** | CI/CD pipeline integration | GitHub Actions, npm scripts, shell scripts |

### When to Use Each Build System

| Project Type | Recommended Build System | Reason |
|--------------|--------------------------|--------|
| Python library | Poetry | Modern dependency management, publishing |
| Python application | pyinstaller | Standalone executable creation |
| JavaScript library | Rollup/esbuild | Tree-shaking, format output |
| JavaScript application | Vite | Fast development server, production build |
| Shell scripts | Make | Dependency management, cross-platform |
| C/C++ project | CMake | Cross-platform compilation, IDE integration |

