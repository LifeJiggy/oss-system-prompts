## 2. Gate 1: Build System Selection

### 2.1 Decision Framework

Use this framework to select the appropriate build system:

```
Step 1: What is your output?
  ├─ Library/Package → Go to Step 2
  ├─ Application → Go to Step 3
  └─ Scripts → Make

Step 2: What language?
  ├─ Python → Poetry
  ├─ JavaScript → Rollup/esbuild
  └─ Other → Language-specific tool

Step 3: What platform?
  ├─ Web → Vite
  ├─ Node.js → Webpack/esbuild
  └─ Desktop → pyinstaller/Cross-platform
```

### 2.2 Comparison Matrix

| Feature | Python (Poetry) | JavaScript (Vite) | Shell (Make) |
|---------|-----------------|-------------------|--------------|
| Dependency Management | ✅ Excellent | ✅ Good | ❌ Manual |
| Cross-Platform | ✅ Good | ✅ Excellent | ⚠️ Limited |
| Publishing | ✅ Native | ✅ via npm | ❌ Manual |
| Hot Reload | ❌ | ✅ Built-in | ❌ Manual |
| Configuration | pyproject.toml | vite.config.ts | Makefile |

