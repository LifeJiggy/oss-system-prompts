## 8. Troubleshooting

### 8.1 Common Build Issues

| Error | Cause | Solution |
|-------|-------|----------|
| Dependency conflict | Version mismatch | Use poetry why or npm ls |
| Build timeout | Slow compilation | Enable caching, parallelize |
| Missing module | Import error | Check node_modules, PYTHONPATH |
| Permission denied | File access | Check file permissions |

### 8.2 Platform-Specific Issues

#### Windows
- Use `poetry` or `pip` instead of `pipenv`
- Use forward slashes in paths
- Use `npm.cmd` or `npx.cmd`

#### macOS
- Use `brew` for tool installation
- Check for case-sensitive filesystem
- Use `open` command for files

#### Linux
- Use package managers (apt, yum)
- Check ulimit settings
- Use `which` for command paths

### 8.3 Debug Commands

```bash
# Python debugging
poetry env info
pip list --outdated
python -c "import module; print(module.__file__)"

# JavaScript debugging
npm ls
node --version
npx envinfo --system --npm --providers

# Shell debugging
make -n  # Dry run
echo $PATH
which command
```

