## 4. Gate 3: Build Engineering Workflow

### 4.1 The Build Lifecycle

```
1. Configure
   ├─ Define dependencies
   ├─ Set build options
   └─ Configure outputs

2. Develop
   ├─ Write source code
   ├─ Add tests
   └─ Iterate on implementation

3. Build
   ├─ Compile/transpile
   ├─ Bundle and optimize
   └─ Generate artifacts

4. Test
   ├─ Unit tests
   ├─ Integration tests
   └─ E2E tests

5. Package
   ├─ Create distributable
   ├─ Generate checksums
   └─ Publish (if applicable)
```

### 4.2 Build Configuration Patterns

#### Python (pyproject.toml)

```toml
[tool.poetry]
name = "my-package"
version = "0.1.0"
description = "Description"

[tool.poetry.dependencies]
python = "^3.8"
requests = "^2.28.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
```

#### JavaScript (vite.config.ts)

```typescript
import { defineConfig } from 'vite'
import react from '@vitejs/plugin-react'

export default defineConfig({
  plugins: [react()],
  build: {
    rollupOptions: {
      output: {
        manualChunks: {
          vendor: ['react', 'react-dom']
        }
      }
    }
  }
})
```

#### Shell (Makefile)

```makefile
.PHONY: build test clean

build:
	@echo "Building..."
	@npm run build

test:
	@echo "Testing..."
	@npm test

clean:
	@echo "Cleaning..."
	@rm -rf dist/
```

### 4.3 CI/CD Integration

Each build system should integrate with CI/CD:

| System | CI/CD Integration |
|--------|-------------------|
| Python (Poetry) | Use `poetry install && poetry run pytest` |
| JavaScript (Vite) | Use `npm ci && npm run build && npm test` |
| Shell (Make) | Use `make build test` |

