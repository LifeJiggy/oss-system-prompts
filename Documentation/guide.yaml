## 7. Documentation Patterns

### 7.1 README Patterns

#### CLI Tool

```markdown
# project

[![npm](https://img.shields.io/npm/v/project)](https://npmjs.org/package/project)

> One-line CLI description.

## Installation
```bash
npm install -g project
```

## Usage
```bash
project [options] <command>
```

## Options
| Option | Description |
|--------|-------------|
| `--help` | Show help |
| `--version` | Show version |
```

#### Library/Package

```markdown
# @org/package

[![npm](https://img.shields.io/npm/v/@org/package)](https://npmjs.org/package/@org/package)

> Library description.

## Installation
```bash
npm install @org/package
```

## Quick Start
```js
import { something } from '@org/package'

const result = something()
```

## API
See [API Documentation](docs/api.md)
```

### 7.2 API Documentation Patterns

| Pattern | Example |
|---------|---------|
| **Function** | `/** * Calculates sum * @param a - First number * @param b - Second number * @returns Sum of a and b */` |
| **Class** | `/** * User model * @property id - User ID * @property name - User name */` |
| **Type** | `/** * Configuration options */` |

### 7.3 Tutorial Patterns

```markdown
# Getting Started

## Prerequisites
- Node.js 18+
- API key

## Installation
```bash
npm install -g project
```

## Your First Command
```bash
project init
project "Hello, World!"
```

## Understanding Output
[Explain what user sees]

## Next Steps
- [Configuration](configuration.md)
- [Advanced Usage](advanced.md)
```

