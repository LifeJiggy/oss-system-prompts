## 4. Gate 3: Documentation Review

### 4.1 Review Checklist

- [ ] Accurate (matches actual behavior)
- [ ] Complete (no missing sections)
- [ ] Clear (understandable to target audience)
- [ ] Current (up-to-date with latest version)
- [ ] Examples work (copy-paste verified)
- [ ] Links valid (no broken links)
- [ ] Well-formatted (proper Markdown)

### 4.2 Review Process

```
Author → Reviewer → Editor → Publish
```

1. **Technical Review**: Accuracy of content
2. **Editorial Review**: Clarity and style
3. **Link Check**: Broken links
4. **Spell Check**: Typos and grammar

### 4.3 Automation

```yaml
# CI checks for documentation
- name: Lint documentation
  run: npx markdownlint '**/*.md'
  
- name: Check links
  run: npx linkchecker docs/
  
- name: Spell check
  run: npx cspell '**/*.md'
```

---

## 5. Gate 4: Documentation Maintenance

### 5.1 Maintenance Schedule

| Frequency | Task |
|-----------|------|
| **Per release** | Update for new features |
| **Monthly** | Link check, spell check |
| **Quarterly** | Content audit |
| **Annually** | Style guide review |

### 5.2 Update Triggers

Documentation should be updated when:

- [ ] New features added
- [ ] Breaking changes released
- [ ] User feedback indicates confusion
- [ ] API changes made
- [ ] Bug fixes affect behavior

### 5.3 Version Management

| Approach | Description |
|----------|-------------|
| **Versioned docs** | /docs/v1.0/, /docs/v2.0/ |
| **Versioned README** | README.v1.md, README.v2.md |
| **Single source** | One docs site with version selector |

