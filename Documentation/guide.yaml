## 3. Gate 2: Documentation Writing

### 3.1 Writing Standards

#### README Structure

```markdown
# Project Name

> One-line description.

## Features
- Feature 1
- Feature 2

## Quick Start
```bash
npm install -g project
project --help
```

## Usage
```bash
project analyze <path>
```

## Configuration
See [config docs](docs/configuration.md)

## Contributing
See [CONTRIBUTING.md](CONTRIBUTING.md)

## License
[MIT](LICENSE)
```

#### API Documentation Pattern

```typescript
/**
 * Processes input data and returns results.
 *
 * @param data - Input data to process
 * @param options - Processing options
 * @returns Processed results
 *
 * @example
 * ```ts
 * const result = processData({ key: "value" })
 * console.log(result.status) // "success"
 * ```
 */
export function processData(data: object, options?: Options): Result
```

