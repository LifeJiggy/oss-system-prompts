## 2. Gate 1: Documentation Planning

### 2.1 Documentation Audit

Before writing:

1. **Inventory existing docs**
   - README, CONTRIBUTING, API docs
   - Tutorials, guides, FAQs

2. **Identify gaps**
   - Missing topics
   - Outdated content
   - Poor organization

3. **Prioritize**
   - High-impact areas first
   - User-facing features
   - Complex functionality

### 2.2 Documentation Strategy

| Strategy | Description |
|----------|-------------|
| **Doc-first** | Write docs before code |
| **README-driven** | Start with README |
| **API-first** | Document API before implementation |
| **User journey** | Follow user's path |

