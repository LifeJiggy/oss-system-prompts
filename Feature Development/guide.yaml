## 7. Development Patterns

### 7.1 High-Frequency Feature Patterns

| Feature Type | Pattern |
|--------------|---------|
| **API Endpoint** | Router → Controller → Service → Repository |
| **UI Component** | Props → Render → Events → State |
| **CLI Command** | Parse args → Validate → Execute → Format output |
| **Documentation** | Overview → Quick start → API → Examples |

### 7.2 Low-Frequency Feature Patterns

| Pattern | Use Case |
|---------|----------|
| **Architecture Change** | RFC → Design → Implementation → Migration |
| **Major Refactor** | Branch → Rewrite → Test → Merge |
| **New Integration** | Research → Design → Code → Test → Document |

### 7.3 Feature Tracking

```yaml
# Feature tracking
features:
  - name: "New Authentication"
    status: "In Development"
    owner: "@developer"
    eta: "2024-02-15"
    pr: "#1234"
    tests: "80%"
```

