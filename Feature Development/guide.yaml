## 2. Gate 1: Feature Planning

### 2.1 Feature Planning Process

```
1. Ideation
   ├─ User request
   ├─ Product requirement
   └─ Technical opportunity

2. Evaluation
   ├─ Impact assessment
   ├─ Effort estimation
   └─ Dependencies

3. Prioritization
   ├─ Roadmap alignment
   ├─ Resource availability
   └─ Risk assessment

4. Planning
   ├─ Break into tasks
   ├─ Set timeline
   └─ Assign ownership
```

### 2.2 Feature Evaluation Matrix

| Criterion | Weight | Scoring |
|-----------|--------|---------|
| **User Value** | 30% | High/Medium/Low |
| **Technical Fit** | 25% | Good/Neutral/Bad |
| **Effort** | 20% | Small/Medium/Large |
| **Risk** | 15% | Low/Medium/High |
| **Dependencies** | 10% | None/External/Internal |

### 2.3 Planning Integration

Connects to:
- **Issue-Management**: Feature issues
- **PR-Templates**: Feature PR templates
- **task**: Feature tasks

