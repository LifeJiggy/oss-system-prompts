## 1. Feature Development Overview

Feature development is the process of adding new functionality to open source projects. This folder provides guidance for high-frequency and low-frequency features.

### The Three Core Files

| File | Purpose | Lines |
|------|---------|-------|
| High-frequence-features-Pro.md | Common feature development | 1538 |
| Low-frequence-features-Pro.md | Edge case features | 1725 |
| Tool-Calling-MCP-Integration.md | MCP tool integration | - |

### The Four Types of Features

| Type | Frequency | Complexity | Examples |
|------|-----------|------------|----------|
| **High-frequency** | Daily/Weekly | Low-Medium | CRUD operations, basic UI |
| **Low-frequency** | Monthly/Yearly | High | Architecture changes, major features |
| **Platform** | Per release | Variable | Cross-cutting concerns |
| **Infrastructure** | Ongoing | Variable | Tooling, CI/CD |

