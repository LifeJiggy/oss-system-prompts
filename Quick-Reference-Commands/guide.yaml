## 4. Gate 3: Command Usage

### 4.1 Common Workflows

#### Create and Submit PR

```bash
# Create feature branch
git checkout -b feature/my-feature

# Make changes
git add .
git commit -m "feat: add new feature"

# Push branch
git push -u origin feature/my-feature

# Create PR
gh pr create --title "feat: add new feature" --body "Description"
```

#### Review and Merge PR

```bash
# View PR
gh pr view 123

# Review PR
gh pr create-review --pr 123 --body "Looks good!"

# Merge PR
gh pr merge 123 --squash --auto
```

#### Manage Issues

```bash
# List issues
gh issue list --state open

# Create issue
gh issue create --title "Bug: something broken" --body "Steps to reproduce..."

# Close issue
gh issue close 123
```

### 4.2 Command Patterns

| Pattern | Usage |
|---------|-------|
| `gh repo view` | Get repo info |
| `gh pr list` | List PRs |
| `gh issue list` | List issues |
| `git log --oneline` | View history |

