## 8. Troubleshooting

### 8.1 Common Command Issues

| Error | Solution |
|-------|----------|
| Authentication failed | `gh auth login` |
| Repository not found | Check owner/repo spelling |
| Permission denied | Check repository access |
| Invalid reference | Check branch name exists |

### 8.2 Debug Commands

```bash
# Check authentication
gh auth status

# View config
gh config get

# Debug Git
git config --list
git remote -v

# Check token
echo $GH_TOKEN
```

