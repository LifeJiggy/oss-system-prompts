## 7. Command Patterns

### 7.1 Repository Patterns

| Task | Command |
|------|---------|
| Clone repo | `gh repo clone owner/repo` |
| View repo | `gh repo view owner/repo` |
| List collaborators | `gh api repos/owner/repo/collaborators` |

### 7.2 Issue Patterns

| Task | Command |
|------|---------|
| Create issue | `gh issue create --title "title" --body "body"` |
| List issues | `gh issue list --state open --limit 10` |
| View issue | `gh issue view 123` |
| Close issue | `gh issue close 123` |

### 7.3 PR Patterns

| Task | Command |
|------|---------|
| Create PR | `gh pr create --title "title" --body "body"` |
| List PRs | `gh pr list --state open` |
| Review PR | `gh pr create-review --pr 123 --body "review"` |
| Merge PR | `gh pr merge 123 --squash --auto` |
| View diff | `gh pr diff 123` |

### 7.4 Branch Patterns

| Task | Command |
|------|---------|
| Create branch | `git checkout -b feature/name` |
| List branches | `git branch -a` |
| Switch branch | `git checkout branch-name` |
| Delete branch | `git branch -D branch-name` |
| Sync with main | `git rebase main` |

