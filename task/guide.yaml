## 3. Gate 2: Task Creation

### 3.1 Task Creation Template

```markdown
# Task: [Task Name]

## Description
Clear description of the task.

## Goals
- Goal 1
- Goal 2

## Acceptance Criteria
- [ ] Criterion 1
- [ ] Criterion 2

## Dependencies
- Task A
- Task B

## References
- Issue #123
- PR #456
```

### 3.2 Task Types

| Type | When to Use |
|------|-------------|
| **Feature** | New functionality |
| **Bug** | Fix broken behavior |
| **Task** | Refactoring, cleanup |
| **Spike** | Research/exploration |
| **Chore** | Maintenance work |

### 3.3 Task Integration

Connects to:
- **Core-Development-Roles**: Role assignment
- **Issue-Management**: Issue linking
- **PR-Templates**: PR creation

