## 7. Task Patterns

### 7.1 Task Creation Patterns

| Scenario | Pattern |
|----------|---------|
| New feature | Create issue → Plan → Implement → Review |
| Bug fix | Find issue → Reproduce → Fix → Test → PR |
| Refactoring | Create task → Plan → Execute → Review |
| Release | Plan → Freeze → Test → Tag → Publish |

### 7.2 Task Tracking Patterns

```yaml
# GitHub issue template
title: '[FEATURE] New feature name'
labels: ['feature', 'good first issue']
projects: ['Roadmap Q1 2024']
assignees: ['username']

# Task checklist
- [ ] Requirements defined
- [ ] Design documented
- [ ] Implementation started
- [ ] Tests written
- [ ] Documentation updated
```

### 7.3 Task Communication Patterns

| Audience | Format |
|----------|--------|
| **Team** | GitHub comment, Slack |
| **Stakeholders** | Summary email |
| **Community** | Public issue comment |
| **Personal** | Private notes |

