## 2. Gate 1: Task Planning

### 2.1 Task Planning Process

```
1. Identify Work
   ├─ From issues
   ├─ From roadmap
   ├─ From user feedback
   
2. Prioritize
   ├─ Impact assessment
   ├─ Effort estimation
   ├─ Dependencies
   
3. Plan
   ├─ Break into subtasks
   ├─ Assign owners
   ├─ Set deadlines
```

### 2.2 Task Sizing

| Size | Effort | Subtasks | Recommendation |
|------|--------|----------|----------------|
| XS | < 1 day | 0-1 | Do immediately |
| S | 1-3 days | 1-2 | Assign to contributor |
| M | 3-7 days | 2-5 | Break into smaller tasks |
| L | 1-2 weeks | 5+ | Create epic, break down |
| XL | > 2 weeks | Many | Must break down |

### 2.3 Planning Integration

Connects to:
- **Issue-Management**: Issue prioritization
- **PR-Templates**: Task PR templates
- **Release & Versioning**: Release planning

