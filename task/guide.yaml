## 8. Troubleshooting

### 8.1 Common Task Issues

| Problem | Solution |
|---------|----------|
| Unclear requirements | Ask for clarification |
| Blocked task | Identify blocker, escalate |
| Overdue task | Re-estimate, adjust plan |
| duplicated work | Check existing issues |

### 8.2 Task Recovery

```bash
# Check task status
gh issue view 123

# Update assignee
gh issue edit 123 --assignee new-person

# Add comment
gh issue comment 123 --body "Status update"

# Close with reason
gh issue close 123 --comment "Won't implement"
```

---

## Quick Start

```bash
# Create a task
gh issue create --title "Task: description" --body "details"

# Assign yourself
gh issue edit 123 --assignee @me

# Add label
gh issue edit 123 --add-label "task"

# Track in project
gh project add 123 --project "Roadmap"
```

