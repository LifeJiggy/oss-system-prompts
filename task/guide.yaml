## 1. Task Management Overview

Task management provides structure for organizing and executing work in open source projects.

### The Task Files

| File | Purpose |
|------|---------|
| task-docs.md | Documentation guide |
| task-enhance.md | Enhancement tasks |
| task-feat.md | Feature development |
| task-fix.md | Bug fixing |
| task-governance.md | Governance tasks |
| task-release.md | Release tasks |
| task-review.md | Review tasks |

### Task Categories

| Category | Purpose |
