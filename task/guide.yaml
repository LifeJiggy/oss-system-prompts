## 4. Gate 3: Task Execution

### 4.1 Execution Workflow

```
Plan → Execute → Review → Revise → Complete
```

### 4.2 Execution Patterns

| Pattern | Description |
|---------|-------------|
| **Time-boxing** | Allocate fixed time |
| **Pomodoro** | 25 min focused work |
| **Pair programming** | Two people, one keyboard |
| **Spike then implement** | Research then build |

### 4.3 Progress Tracking

| Method | Tool |
|--------|------|
| **Task board** | GitHub Projects, Trello |
| **Time tracking** | Harvest, Clockify |
| **Progress notes** | Daily standups |
| **Status updates** | Slack, Discord |

---

## 5. Gate 4: Task Completion

### 5.1 Completion Checklist

- [ ] All acceptance criteria met
- [ ] Tests passing
- [ ] Documentation updated
- [ ] PR merged
- [ ] Issue closed
- [ ] Knowledge shared

### 5.2 Completion Patterns

| Action | Command |
|--------|---------|
| Close issue | `gh issue close 123` |
| Mark PR ready | `gh pr ready 123` |
| Move to done | GitHub Projects drag |
| Notify team | Comment on issue |

### 5.3 Retrospective

After completion:

1. What went well?
2. What could be improved?
3. What did we learn?

