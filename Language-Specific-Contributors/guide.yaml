## 4. Gate 3: Contribution Workflow

### 4.1 Language-Specific Workflow

```
1. Fork and Clone
   ├─ Python: python -m venv venv
   ├─ JavaScript: npm install
   └─ Shell: Review Makefile

2. Create Branch
   ├─ All: git checkout -b feature/name

3. Implement
   ├─ Python: Follow PEP standards
   ├─ JavaScript: Follow ES standards
   └─ Shell: Follow POSIX conventions

4. Test
   ├─ Python: pytest tests/
   ├─ JavaScript: npm test
   └─ Shell: make test

5. Document
   ├─ Python: Docstrings, README
   ├─ JavaScript: JSDoc, README
   └─ Shell: Comments, README

6. Submit
   ├─ All: Create PR with issue reference
```

### 4.2 Testing by Language

| Language | Test Framework | Command |
|----------|----------------|---------|
| Python | pytest | `pytest tests/` |
| JavaScript | Jest/Vitest | `npm test` |
| Shell | bats/shunit2 | `bats tests/` |

