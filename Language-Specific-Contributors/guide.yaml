## 8. Troubleshooting

### 8.1 Python Issues

| Error | Solution |
|-------|----------|
| ModuleNotFoundError | pip install, check PYTHONPATH |
| ImportError | Check __init__.py, relative imports |
| SyntaxError | Check Python version, syntax |

### 8.2 JavaScript Issues

| Error | Solution |
|-------|----------|
| Module not found | npm install, check node_modules |
| SyntaxError | Check ES version, transpile |
| TypeError | Check types, use TypeScript |

### 8.3 Shell Issues

| Error | Solution |
|-------|----------|
| Command not found | Check PATH, use full path |
| Permission denied | chmod +x, check permissions |
| Syntax error | Check shell, use bash |

