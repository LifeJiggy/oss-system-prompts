## 1. Language Contributors Overview

This folder provides specialized guidance for contributing to projects in Python, JavaScript, and Shell. Each language has unique conventions, tooling, and best practices.

### The Three Language Pillars

| Language | Ecosystem | Key Tools |
|----------|-----------|-----------|
| **Python** | PyPI, Poetry, pytest | pip, poetry, pytest, mypy |
| **JavaScript** | npm, Yarn, pnpm | npm, webpack, vite, jest |
| **Shell** | POSIX, bash, make | bash, sh, make, awk |

### When to Use Each Language Guide

- **Contributor-Python-Pro.md**: Python projects, libraries, applications
- **Contributor-JavaScript-Pro.md**: Web projects, Node.js, frontend frameworks
- **Contributor-Shell-Pro.md**: CLI tools, automation scripts, infrastructure

