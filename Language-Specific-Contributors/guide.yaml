## 5. Gate 4: Best Practices

### 5.1 Python Best Practices

- Use type hints for all public functions
- Follow PEP 8 style guide
- Use docstrings for documentation
- Keep functions under 50 lines
- Use context managers for resources

```python
def process_data(data: dict[str, Any]) -> dict[str, Any]:
    """Process input data and return results."""
    with open("output.json", "w") as f:
        json.dump(data, f)
    return {"status": "success"}
```

### 5.2 JavaScript Best Practices

- Use ES modules (import/export)
- Follow TypeScript for type safety
- Use async/await for promises
- Destructure for cleaner code
- Use optional chaining for safety

```javascript
import { processData } from './processor.js';

async function main() {
  const data = { key: 'value' };
  const result = await processData(data);
  console.log(result?.status ?? 'unknown');
}
```

### 5.3 Shell Best Practices

- Use `#!/usr/bin/env bash` for portability
- Quote all variables
- Check exit codes
- Use functions for reusability
- Avoid complex one-liners

```bash
#!/usr/bin/env bash
set -euo pipefail

process_file() {
  local file="$1"
  if [[ ! -f "$file" ]]; then
    echo "Error: $file not found" >&2
    return 1
  fi
  cat "$file"
}
```

