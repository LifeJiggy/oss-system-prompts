## 2. Gate 1: Language Selection

### 2.1 Language Decision Matrix

| Project Type | Recommended Language | Reason |
|--------------|---------------------|--------|
| Data Science | Python | Rich ecosystem, pandas, numpy |
| Web Frontend | JavaScript | Browser-native, React/Vue |
| Web Backend | Python or JavaScript | FastAPI or Node.js |
| CLI Tools | Shell or Python | Shell for simple, Python for complex |
| Infrastructure | Shell | POSIX compatibility |

### 2.2 Ecosystem Integration

Each language integrates with:

- **Python**: PyPI packages, virtual environments, type hints
- **JavaScript**: npm packages, modules, transpilation
- **Shell**: POSIX standards, shebang, exit codes

