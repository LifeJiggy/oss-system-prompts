## 3. Gate 2: Environment Setup

### 3.1 Python Environment

```bash
# Create virtual environment
python -m venv venv
source venv/bin/activate  # Linux/macOS
venv\Scripts\activate      # Windows

# Install dependencies
pip install -r requirements.txt
# or
poetry install

# Verify setup
python -c "import module; print('OK')"
```

### 3.2 JavaScript Environment

```bash
# Install Node.js (v18+ recommended)
nvm install 18
nvm use 18

# Install dependencies
npm install
# or
yarn install
# or
pnpm install

# Verify setup
node -e "console.log('OK')"
```

### 3.3 Shell Environment

```bash
# Check shell version
bash --version
sh --version

# Install linting tools
shellcheck --version

# Test script syntax
bash -n script.sh
```

