## Quick Start

```bash
# Set up community infrastructure
mkdir -p .github/{workflows,ISSUE_TEMPLATE}
cp templates/* .github/

# Create governance docs
touch GOVERNANCE.md CODE_OF_CONDUCT.md CONTRIBUTING.md
```

