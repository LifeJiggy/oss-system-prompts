## 4. Gate 3: Community Management

### 4.1 Moderation Guidelines

| Action | Process |
|--------|---------|
| **New member** | Welcome message, guidelines |
| **Help request** | Respond promptly, be helpful |
| **Contribution** | Review, provide feedback |
| **Conflict** | Mediate, enforce CoC |

### 4.2 Engagement Metrics

| Metric | Target |
|--------|--------|
| **Response time** | < 24 hours |
| **Issue resolution** | < 72 hours |
| **PR review time** | < 48 hours |
| **Community growth** | 10% monthly |

### 4.3 Management Patterns

```yaml
# Community health check
metrics:
  contributors: monthly
  issues_response_time: daily
  pr_review_time: weekly
  community_sentiment: quarterly
```

---

## 5. Gate 4: Conflict Resolution

### 5.1 Conflict Types

| Type | Example | Resolution |
|------|---------|------------|
| **Technical** | Architecture disagreement | Code spike, RFC |
| **Process** | Workflow confusion | Clarify docs |
| **Social** | Personal disagreement | Mediation |
| **Value** | Ethical concerns | Governance vote |

### 5.2 Resolution Process

```
1. Acknowledge concern
2. Gather perspectives
3. Identify common ground
4. Propose solution
5. Follow up
```

### 5.3 De-escalation Techniques

- Listen actively
- Find common ground
- Focus on impact, not intent
- Involve neutral mediator
- Document resolution

