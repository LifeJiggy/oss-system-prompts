## 8. Troubleshooting

### 8.1 Common Community Issues

| Problem | Solution |
|---------|----------|
| Low engagement | More events, better onboarding |
| Toxic behavior | Enforce CoC, mediate |
| Contributor burnout | Rotate responsibilities |
| Fork wars | Communicate, collaborate |

### 8.2 Communication Templates

```markdown
# Welcome Message
Welcome to the community! Please read our [CODE_OF_CONDUCT.md](CODE_OF_CONDUCT.md).

# Issue Response
Thanks for the report! I'll investigate and get back to you.

# PR Feedback
Great work! A few suggestions:
1. ...
2. ...
```

