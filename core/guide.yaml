## 7. Workflow Patterns

### 7.1 Universal Workflow

```
1. Discovery (core/guide.md)
   ├─ Find issue or idea
   ├─ Understand codebase

2. Discussion (rule.md)
   ├─ Open issue
   ├─ Get acknowledgment

3. Implementation (patterns.md)
   ├─ Create branch
   ├─ Write code
   ├─ Add tests

4. Verification (checklist.md)
   ├─ Run checks
   ├─ Self-review
   ├─ Verify diff

5. Submission (guide.md)
   ├─ Write PR
   ├─ Submit
   ├─ Respond to feedback
```

### 7.2 Quick Reference

| Need | Core File |
|------|-----------|
| Rules | rule.md |
| Workflow | guide.md |
| Check | checklist.md |
| Patterns | patterns.md |
| Failures | flop.md |
| Trust | reputation-trust.md |
| Review | review-response.md |

