## 3. Gate 2: Core Files Navigation

### 3.1 The Rulebook (rule.md)

The comprehensive rulebook with 100+ rules organized into 20+ sections (A–U):

| Section | Topics |
|---------|--------|
| A-U | Branch hygiene, code patterns, security, testing, communication |

### 3.2 The Workflow Guide (guide.md)

Step-by-step zero-blockage PR workflow:

```
Before you code → While coding → Before push → After push → Long-term success
```

### 3.3 The Checklist (checklist.md)

Pre-submission verification with 80+ items:

- Syntax, imports, types
- Security, resources, testing
- Documentation, communication

### 3.4 The Patterns (patterns.md)

Multi-language code patterns for:
- Module registration
- Error handling
- Async code
- Security

