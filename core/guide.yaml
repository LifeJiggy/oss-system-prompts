## 8. Troubleshooting

### 8.1 Common Core Issues

| Problem | Solution |
|---------|----------|
| Unclear workflow | Re-read guide.md |
| Code style issues | Check patterns.md |
| Review rejection | Use review-response.md |
| PR blocked | Check checklist.md |

### 8.2 Quick Help

```bash
# Find relevant rules
grep -i "one change" core/rule.md

# Check workflow
cat core/guide.md | head -50

# Verify checklist
cat core/checklist.md | grep -A5 "Pre-submission"
```

