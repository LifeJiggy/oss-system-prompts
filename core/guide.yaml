## 2. Gate 1: Getting Started

### 2.1 Quick Start

```bash
# Explore core files
ls core/*.md

# Read the rulebook first
cat core/rule.md

# Follow the workflow
cat core/guide.md
```

### 2.2 Essential Reading Order

1. **rule.md** - Understand the rules
2. **guide.md** - Learn the workflow
3. **checklist.md** - Prepare for submission
4. **patterns.md** - Write good code
5. **review-response.md** - Handle reviews

### 2.3 Quick Start Integration

Connects to:
- **All folders**: Universal principles
- **PR-Templates**: Workflow guidance
- **Core-Development-Roles**: Role-specific application

