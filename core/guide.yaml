## 4. Gate 3: Applying Core Principles

### 4.1 The Five Rules

1. **ONE change per PR**
2. **Discuss first**
3. **Tests required**
4. **Copy exactly**
5. **Respond fast**

### 4.2 Universal Principles

These principles apply to all OSS projects:

| Principle | Application |
|-----------|-------------|
| **Minimal Scope** | One change per PR |
| **Prior Discussion** | Open issue first |
| **Exact Copying** | Match existing patterns |
| **Complete Testing** | Always add tests |
| **Fast Response** | Within 48 hours |

### 4.3 Applying to Specific Tasks

| Task | Core Application |
|------|------------------|
| **Bug Fix** | Use blockage.md to avoid |
| **Feature** | Follow guide.md workflow |
| **Review** | Use review-response.md |
| **Refactor** | Apply patterns.md |

