## 1. Core Knowledge Base Overview

The core knowledge base is the foundation of OSS contribution guidance. It contains universal principles, workflows, and patterns that apply to any open source project.

### The Core Files

| File | Purpose | Lines |
|------|---------|-------|
| rule.md | Comprehensive rulebook | 1440+ |
| blockage.md | Anti-pattern collection | 1670+ |
| guide.md | Step-by-step workflow | 1760+ |
| checklist.md | Pre-submission verification | 1110+ |
| patterns.md | Multi-language patterns | 1770+ |
| flop.md | Failure documentation | 1330+ |
| reputation-trust.md | Trust-building | 1360+ |
| review-response.md | Review communication | 1000+ |

### The Five Layers

```
Layer 1: Contribution Workflow (9 files)
  └── Individual contributor journey

Layer 2: Ecosystem Knowledge (7 files)
  └── Cross-project knowledge

Layer 3: Specialized Domains (7 files)
  └── AI/ML, a11y, legal, etc.
```

