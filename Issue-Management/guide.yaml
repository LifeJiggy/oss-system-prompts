## 3. Gate 2: Issue Triage

### 3.1 Triage Process

```
1. Reproduce
   ├─ Verify issue exists
   ├─ Document steps
   └─ Identify environment

2. Categorize
   ├─ Bug / Feature / Task
   ├─ Severity (P0-P3)
   └─ Priority (High/Medium/Low)

3. Assign
   ├─ Find responsible person
   ├─ Set milestone
   └─ Add labels
```

### 3.2 Severity Classification

| Severity | Criteria | Response Time |
|----------|----------|---------------|
| P0 | Critical bug, security issue | Immediate |
| P1 | High impact, blocks users | 24 hours |
| P2 | Medium impact, workaround exists | 72 hours |
| P3 | Low impact, edge case | 1 week |

### 3.3 Priority Labels

| Label | Meaning |
|-------|---------|
| good first issue | New contributor friendly |
| help wanted | Needs community attention |
| bug | Something is broken |
| enhancement | New feature request |
| documentation | Docs need updating |

---

## 4. Gate 3: Issue Resolution

### 4.1 Resolution Strategies

| Strategy | Use Case |
|----------|----------|
| **Fix** | Bug can be corrected |
| **Workaround** | Provide temporary solution |
| **Won't Fix** | Invalid or low priority |
| **Duplicate** | Already reported |
| **Question** | Needs clarification |

### 4.2 Fixing Process

1. **Create branch** from latest main
2. **Implement fix** following project patterns
3. **Add tests** for the fix
4. **Run quality checks** (lint, test, typecheck)
5. **Update documentation** if needed
6. **Submit PR** with issue reference

### 4.3 Resolution Checklist

- [ ] Root cause identified
- [ ] Fix implemented
- [ ] Tests added
- [ ] Documentation updated
- [ ] PR submitted
- [ ] Issue linked to PR

---

## 5. Gate 4: Issue Documentation

### 5.1 Issue Template

```markdown
## Description
Clear description of the issue.

## Steps to Reproduce
1. Step one
2. Step two
3. Expected vs actual result

## Environment
- OS: [e.g., macOS, Windows]
- Version: [e.g., 1.0.0]
- Browser: [if applicable]

## Additional Context
Any other information about the issue.
```

### 5.2 Resolution Documentation

When closing issues:

```markdown
## Resolution
Fixed in PR #1234.

## Changes Made
- Added null check for input
- Added test case
- Updated error message

## Verification
Tested on [platform] with [version].
```

