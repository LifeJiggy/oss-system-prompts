## 1. Issue Management Overview

Issue management is the backbone of effective open source development. This folder provides guidance for finding, triaging, and resolving issues.

### The Two Core Files

| File | Purpose | Lines |
|------|---------|-------|
| Issue-finder-Pro.md | Bug discovery and triage | 1513 |
| Issue-fixer-Pro.md | Debugging and fixing strategies | 1582 |

### The Issue Lifecycle

```
DISCOVER → TRIAGE → PRIORITIZE → ASSIGN → RESOLVE → VERIFY → CLOSE
```

