## 2. Gate 1: Issue Discovery

### 2.1 Discovery Methods

| Method | Description | Tools |
|--------|-------------|-------|
| **Code Review** | Find issues in existing code | GitHub, GitLab |
| **Testing** | Discover failures in tests | pytest, Jest |
| **User Reports** | Issues reported by users | Issue trackers |
| **Static Analysis** | Automated issue detection | linters, SAST |
| **Security Scan** | Vulnerability discovery | Snyk, npm audit |

### 2.2 Issue Discovery Checklist

- [ ] Run automated tests
- [ ] Check CI/CD failure logs
- [ ] Review code for anti-patterns
- [ ] Scan for security vulnerabilities
- [ ] Monitor user feedback
- [ ] Review dependency updates

### 2.3 Discovery Integration

Connects to:
- **Core-Development-Roles**: Issue-finding patterns
- **Code-Quality**: Testing and security tools
- **Build-Systems**: Build failure detection

