## 8. Troubleshooting

### 8.1 Common Issue Problems

| Problem | Solution |
|---------|----------|
| Unreproducible | Add more context, environment details |
| Vague description | Request specific steps, screenshots |
| Duplicate | Search existing issues, link to original |
| Stale | Comment asking for update, close if no response |

### 8.2 Communication Patterns

| Situation | Response |
|-----------|----------|
| Need more info | "Can you provide [specific info]?" |
| Already fixed | "This is fixed in [version/PR]" |
| Won't fix | "We're not planning to [reason]" |
| Duplicate | "See [link] for details" |

---

## Quick Start

```bash
# Find issues
gh issue list --state open
gh issue list --label "good first issue"

# Create issue
gh issue create --title "Bug: description" --body "steps to reproduce..."

# Link PR to issue
gh pr create --title "Fix: description" --body "Closes #123"
```

