## 7. Workflow Patterns

### 7.1 Issue-to-PR Workflow

```
Issue Created
      ↓
Triage (P0-P3)
      ↓
Assigned to Contributor
      ↓
Branch Created (fix/issue-name)
      ↓
Fix Implemented + Tests
      ↓
PR Submitted
      ↓
Review + CI Checks
      ↓
Merge + Close Issue
```

### 7.2 Triage Meeting Pattern

Weekly triage meeting agenda:

1. **New Issues** (15 min)
   - Review new reports
   - Assign severity

2. **Stale Issues** (10 min)
   - Check progress
   - Update status

3. **Prioritization** (10 min)
   - Order by priority
   - Plan next sprint

### 7.3 Automation Patterns

```yaml
# GitHub Actions for issue management
name: Issue Triage
on:
  issues:
    types: [opened, labeled]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Auto-label based on content
```

