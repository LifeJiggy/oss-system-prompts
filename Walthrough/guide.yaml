## 3. Gate 2: Content Creation

### 3.1 Content Structure

```markdown
# Title

> Brief description.

## Prerequisites
- Requirement 1
- Requirement 2

## Step 1: Description
```bash
command
```

## Step 2: Description
```bash
command
```

## Verification
Expected output or check.

## Next Steps
- [Link to next topic](next.md)
- [Link to related topic](related.md)
```

### 3.2 Content Patterns

| Pattern | Example |
|---------|---------|
| **Command** | \`\`\`bash\nnpm install\n\`\`\` |
| **Code** | \`\`\`js\nconsole.log('hello')\n\`\`\` |
| **Output** | \`\`\`\nExpected output\n\`\`\` |
| **Warning** | > ⚠️ Warning: important note |
| **Tip** | > 💡 Tip: useful suggestion |

### 3.3 Creation Integration

Connects to:
- **Documentation**: Writing standards
- **Build-Systems**: Demo projects
- **Code-Quality**: Example verification

